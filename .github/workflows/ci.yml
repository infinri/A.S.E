name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Dependency audit (gates merge on known CVEs)
        run: composer audit --no-dev

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit (network-dependent CLI test excluded)
        run: vendor/bin/phpunit tests/Unit --filter '^((?!CliIntegration).)*$'
